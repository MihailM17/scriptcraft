name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-macos:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace

  test-linux:
    name: tests (Linux) + app smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb
      - name: Core tests
        run: cargo test -p scriptcraft-core
      - name: Layout tests
        run: cargo test -p scriptcraft-layout
      - name: App lib tests
        run: cargo test -p scriptcraft-app --lib
      - name: App interaction smoke (Xvfb)
        run: xvfb-run -a cargo test -p scriptcraft-app --test interaction -- --test-threads=1
      - name: Launch packaged binary smoke (Xvfb)
        shell: bash
        run: |
          cargo build -p scriptcraft-app
          set +e
          timeout 8s xvfb-run -a ./target/debug/scriptcraft-app
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Binary stayed alive for 8s without crashing (startup smoke OK)."
            exit 0
          fi
          echo "Binary exited with code $code before timeout."
          exit "$code"
      - name: Compile app and all test targets
        run: cargo check -p scriptcraft-app --all-targets

  test-windows:
    name: tests (Windows) + app smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p scriptcraft-core
      - name: Layout tests
        run: cargo test -p scriptcraft-layout
      - name: App lib tests
        run: cargo test -p scriptcraft-app --lib
      - name: App interaction smoke
        run: cargo test -p scriptcraft-app --test interaction -- --test-threads=1
      - name: Launch packaged binary smoke
        shell: pwsh
        run: |
          cargo build -p scriptcraft-app
          $out = Join-Path $env:RUNNER_TEMP "scriptcraft-stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "scriptcraft-stderr.txt"
          $p = Start-Process -FilePath "target\debug\scriptcraft-app.exe" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(8000)) {
            $p.Kill()
            Write-Host "Binary stayed alive for 8s without crashing (startup smoke OK)."
            exit 0
          }
          Write-Host "Binary exited with code $($p.ExitCode) before timeout."
          if (Test-Path $out) { Write-Host "--- stdout ---"; Get-Content $out }
          if (Test-Path $err) { Write-Host "--- stderr ---"; Get-Content $err }
          # GitHub's Windows runners have no OpenGL 2.0 context. Reaching this
          # error proves startup, window creation and renderer selection ran;
          # it is the runner's limit, not an app crash. Any other early exit
          # (panic, missing asset, bad settings) still fails the job.
          $errText = if (Test-Path $err) { Get-Content $err -Raw } else { "" }
          if ($p.ExitCode -eq 1 -and $errText -match "egui_glow requires opengl 2\.0\+") {
            Write-Host "Runner has no OpenGL 2.0 context; startup reached the renderer (smoke OK)."
            exit 0
          }
          exit $p.ExitCode
      - name: Compile app and all test targets
        run: cargo check -p scriptcraft-app --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
