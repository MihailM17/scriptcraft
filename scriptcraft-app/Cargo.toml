[package]
name = "scriptcraft-app"
version = "0.6.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MihailM17/scriptcraft"

[lib]
name = "scriptcraft_app"
path = "src/lib.rs"

[[bin]]
name = "scriptcraft-app"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.32"
egui = "0.32"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
scriptcraft-core = { path = "../scriptcraft-core", version = "0.1.0" }
scriptcraft-layout = { path = "../scriptcraft-layout", version = "0.1.0" }
muda = "0.21.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
egui_kittest = { version = "0.32", features = ["eframe", "wgpu", "snapshot"] }
