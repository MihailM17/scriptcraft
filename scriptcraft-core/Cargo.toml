[package]
name = "scriptcraft-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MihailM17/scriptcraft"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
