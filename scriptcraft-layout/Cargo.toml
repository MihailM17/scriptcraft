[package]
name = "scriptcraft-layout"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MihailM17/scriptcraft"
description = "Screenplay layout engine: wrapping, pagination and placed lines in document units."

[dependencies]
scriptcraft-core = { path = "../scriptcraft-core", version = "0.1.0" }
printpdf = "0.12"
thiserror = "2"
ttf-parser = "0.25"

[build-dependencies]
ttf-parser = "0.25"

[dev-dependencies]
criterion = "0.8.2"
lopdf = "0.44"
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "layout"
harness = false
